[workspace]
members = [
	"crates/ntsql-compatibility",
	"crates/ntsql-contract",
	"crates/ntsql-diagnostics",
	"crates/ntsql-storage-file",
	"crates/ntsql-storage-memory",
	"crates/ntsql-testkit",
	"crates/ntsql-transaction",
	"crates/ntsql-wal",
	"tools/ntsql-architecture-check",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/anaregdesign/ntsql"
rust-version = "1.97.1"

[workspace.dependencies]
ntsql-compatibility = { version = "0.1.0", path = "crates/ntsql-compatibility" }
ntsql-contract = { version = "0.1.0", path = "crates/ntsql-contract" }
ntsql-transaction = { version = "0.1.0", path = "crates/ntsql-transaction" }
ntsql-wal = { version = "0.1.0", path = "crates/ntsql-wal" }
serde = { version = "1.0.219", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0.142", default-features = false, features = ["arbitrary_precision", "std"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
