[workspace]
members = [
	"crates/ntsql-compatibility",
	"crates/ntsql-contract",
	"tools/ntsql-architecture-check",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/anaregdesign/ntsql"
rust-version = "1.88"

[workspace.dependencies]
ntsql-compatibility = { path = "crates/ntsql-compatibility" }
serde = { version = "1.0.219", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0.142", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
